<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What's Cooking</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/Sortable.min.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div class="card" id="card">
  <header data-tauri-drag-region>
    <h1 data-tauri-drag-region id="head">Cooking</h1>
    <span class="badge" id="badge" hidden></span>
    <button class="icon" id="size" title="Grow to maximum size" aria-label="Toggle size">
      <svg viewBox="0 0 16 16" class="grow"><path d="M9.5 2.5h4v4M13.5 2.5l-5 5M6.5 13.5h-4v-4M2.5 13.5l5-5"/></svg>
      <svg viewBox="0 0 16 16" class="shrink"><path d="M13.5 6.5h-4v-4M9.5 6.5l5-5M2.5 9.5h4v4M6.5 9.5l-5 5"/></svg>
    </button>
    <button class="icon" id="hide" title="Hide (tray icon shows it again)" aria-label="Hide">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>
  <div class="body" id="body">
    <div class="entry">
      <input id="entry" placeholder="New dish  #tag  /w 20" autocomplete="off" spellcheck="false">
      <ul class="suggest" id="suggest" hidden></ul>
    </div>
    <div class="list" id="list"></div>
    <section class="washer" id="washer">
      <button class="washer-head" id="washer-toggle">
        <svg viewBox="0 0 16 16" class="chev"><path d="M6 4l4 4-4 4"/></svg>
        <span id="washer-title">Dishwasher</span>
      </button>
      <div class="washer-body" id="washer-body">
        <div id="washer-list"></div>
        <button class="wash" id="wash">Run the dishwasher</button>
      </div>
    </section>
  </div>
  <div class="grip-resize" id="resize" title="Resize"></div>
</div>
<div class="popover" id="popover" hidden></div>
</body>
</html>
